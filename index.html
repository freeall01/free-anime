<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FREE-ANIME - Stream Anywhere</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Essential: HLS.js for decoding raw video streams -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans selection:bg-emerald-500 selection:text-white">
    <header class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex items-center justify-between shadow-lg">
        <span class="text-xl font-black text-emerald-500 tracking-wider">FREE<span class="text-white">-ANIME</span></span>
        <div class="w-1/2 max-w-sm">
            <input type="text" id="searchInput" placeholder="Search anime..." class="w-full bg-slate-800 text-sm text-slate-200 px-4 py-2 rounded-full border border-slate-700 focus:outline-none focus:border-emerald-500 transition shadow-inner">
        </div>
    </header>

    <main class="p-4 max-w-7xl mx-auto">
        <h2 class="text-lg font-bold text-slate-200 mb-6 flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse shadow-[0_0_10px_rgba(16,185,129,0.8)]"></span>
            Trending Catalog
        </h2>
        <div id="animeGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 sm:gap-6">
            <div class="col-span-full text-center py-20 text-slate-400 font-medium animate-pulse">Initializing database...</div>
        </div>
    </main>

    <!-- Native Video Player Modal -->
    <div id="videoModal" class="fixed inset-0 bg-black/95 z-50 hidden flex flex-col justify-center items-center p-2 sm:p-4 backdrop-blur-md">
        <div class="w-full max-w-5xl bg-slate-900 rounded-2xl overflow-hidden border border-slate-700 shadow-2xl flex flex-col">
            
            <div class="flex justify-between items-center px-4 py-3 bg-slate-950 border-b border-slate-800">
                <h3 id="modalTitle" class="text-sm font-bold text-slate-100 truncate pr-2">Player</h3>
                <button onclick="closePlayer()" class="text-emerald-400 hover:text-white font-bold px-4 py-1.5 bg-slate-800 hover:bg-emerald-600 rounded-lg text-xs transition shadow">✕ Close</button>
            </div>

            <div id="playerWrapper" class="relative w-full aspect-video bg-black flex flex-col items-center justify-center p-4">
                
                <!-- Loading State -->
                <div id="loadingStatus" class="flex flex-col items-center justify-center text-slate-300">
                    <div class="w-10 h-10 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                    <span id="statusText" class="text-sm font-medium">Bypassing ISP blocks and extracting video...</span>
                </div>

                <!-- Native Video Tag -->
                <video id="nativeVideo" controls class="w-full h-full hidden rounded-b-lg object-contain bg-black"></video>

                <!-- Ultimate Anti-Block Fallback -->
                <div id="fallbackStatus" class="hidden flex-col items-center justify-center w-full max-w-md text-center">
                    <svg class="w-12 h-12 text-rose-500 mb-4 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                    <h4 class="text-lg font-bold text-white mb-2">Network Restricted</h4>
                    <p class="text-xs text-slate-400 mb-6">Your internet provider (Airtel/Jio) blocked the direct video stream. Please use the Unblocked External Servers below (they will open safely in a new tab).</p>
                    <div id="fallbackButtons" class="flex flex-col gap-3 w-full"></div>
                </div>

            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
