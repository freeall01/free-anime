<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FREE-ANIME - Watch Free Anime Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Native HLS Support -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">
    <header class="sticky top-0 z-50 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex items-center justify-between shadow-md">
        <span class="text-xl font-black text-rose-500 tracking-wider">FREE-<span class="text-white">ANIME</span></span>
        <div class="w-1/2 max-w-sm">
            <input type="text" id="searchInput" placeholder="Search anime..." class="w-full bg-slate-800 text-sm text-slate-200 px-4 py-2 rounded-full border border-slate-700 focus:outline-none focus:border-rose-500 transition">
        </div>
    </header>

    <main class="p-4 max-w-7xl mx-auto">
        <h2 class="text-lg font-bold text-slate-200 mb-6 flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-rose-500 animate-pulse"></span>
            Trending Anime
        </h2>
        <div id="animeGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
            <div class="col-span-full text-center py-20 text-slate-400">Loading catalog...</div>
        </div>
    </main>

    <!-- Ultimate Player Modal -->
    <div id="videoModal" class="fixed inset-0 bg-black/95 z-50 hidden flex flex-col justify-center items-center p-2 sm:p-4 backdrop-blur-md">
        <div class="w-full max-w-4xl bg-slate-900 rounded-xl overflow-hidden border border-slate-700 shadow-2xl flex flex-col">
            
            <div class="flex justify-between items-center px-4 py-3 bg-slate-950 border-b border-slate-800">
                <h3 id="modalTitle" class="text-sm font-bold text-slate-100 truncate pr-2">Player</h3>
                <button onclick="closePlayer()" class="text-rose-400 hover:text-white font-bold px-3 py-1.5 bg-slate-800 rounded-lg text-xs transition">✕ Close</button>
            </div>

            <div class="relative w-full aspect-video bg-black flex flex-col items-center justify-center p-4">
                
                <!-- State 1: Loading -->
                <div id="loadingState" class="flex flex-col items-center justify-center text-slate-300">
                    <div class="w-8 h-8 border-4 border-rose-500 border-t-transparent rounded-full animate-spin mb-3"></div>
                    <span id="loadingText" class="text-sm">Connecting to secure stream...</span>
                </div>

                <!-- State 2: Native Video Player (If successful) -->
                <video id="nativeVideo" controls class="w-full h-full hidden object-contain"></video>

                <!-- State 3: Fallback UI (If ISP blocks API or iframe) -->
                <div id="fallbackState" class="hidden flex flex-col items-center justify-center w-full max-w-md text-center">
                    <svg class="w-12 h-12 text-rose-500 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                    <h4 class="text-lg font-bold text-white mb-2">Native Stream Blocked by ISP</h4>
                    <p class="text-xs text-slate-400 mb-6">Your browser security or internet provider is blocking the direct connection. Please select a secure external server below. It will open in a new tab to guarantee playback.</p>
                    
                    <div class="flex flex-col w-full gap-3" id="fallbackButtons">
                        <!-- Buttons injected via JS -->
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
