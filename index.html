<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free-Anime - Ongoing Anime</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">
    <header class="sticky top-0 z-50 bg-slate-900/80 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex items-center justify-between">
        <span class="text-xl font-black text-rose-500 tracking-wider">FREE-<span class="text-white">ANIME</span></span>
        <div class="w-1/2 max-w-xs">
            <input type="text" id="searchInput" placeholder="Search anime..." class="w-full bg-slate-800 text-sm text-slate-200 px-3 py-1.5 rounded-full border border-slate-700 focus:outline-none focus:border-rose-500">
        </div>
    </header>
    <main class="p-4 max-w-6xl mx-auto">
        <h2 class="text-lg font-bold text-slate-200 mb-4 flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-rose-500 animate-pulse"></span>
            Currently Airing & Ongoing
        </h2>
        <div id="animeGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
            <div class="col-span-full text-center py-20 text-slate-500">Loading ongoing anime list...</div>
        </div>
    </main>
    <script src="app.js"></script>
</body>
</html>
