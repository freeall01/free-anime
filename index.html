<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FREE-ANIME - Pro Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Crucial: HLS.js decodes raw streaming files -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">
    <header class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex items-center justify-between shadow-md">
        <span class="text-xl font-black text-rose-500 tracking-wider">FREE-<span class="text-white">ANIME</span></span>
        <div class="w-1/2 max-w-xs">
            <input type="text" id="searchInput" placeholder="Search anime..." class="w-full bg-slate-800 text-sm text-slate-200 px-4 py-2 rounded-full border border-slate-700 focus:outline-none focus:border-rose-500 transition">
        </div>
    </header>

    <main class="p-4 max-w-6xl mx-auto">
        <h2 class="text-lg font-bold text-slate-200 mb-4 flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-rose-500 animate-pulse"></span>
            Trending Catalog
        </h2>
        <div id="animeGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
            <div class="col-span-full text-center py-20 text-slate-400">Loading catalog...</div>
        </div>
    </main>

    <!-- Native Video Player Modal (No Iframes) -->
    <div id="videoModal" class="fixed inset-0 bg-black/95 z-50 hidden flex flex-col justify-center items-center p-2 sm:p-4 backdrop-blur-sm">
        <div class="w-full max-w-4xl bg-slate-900 rounded-2xl overflow-hidden border border-slate-800 shadow-2xl flex flex-col">
            
            <div class="flex justify-between items-center px-4 py-3 bg-slate-950 border-b border-slate-800">
                <h3 id="modalTitle" class="text-sm sm:text-base font-bold text-slate-100 truncate pr-2">Anime Player</h3>
                <button onclick="closePlayer()" class="text-rose-400 hover:text-white font-bold px-3 py-1 bg-slate-800/80 hover:bg-rose-600 rounded-lg text-xs transition">✕ Close</button>
            </div>

            <!-- Episode Selector -->
            <div class="flex items-center gap-2 px-4 py-2.5 bg-slate-900/90 border-b border-slate-800 text-xs">
                <span class="text-slate-400 font-medium">Episode:</span>
                <input type="number" id="epInput" value="1" min="1" class="w-16 bg-slate-950 text-rose-400 font-bold rounded px-2 py-1 outline-none text-center border border-slate-700 focus:border-rose-500">
                <button onclick="loadEpisode()" class="px-3 py-1.5 rounded-lg bg-rose-600 hover:bg-rose-500 text-white font-semibold transition shadow">Load Episode</button>
            </div>

            <!-- Native Video Container -->
            <div class="relative w-full aspect-video bg-black flex items-center justify-center">
                <!-- Loading Animation -->
                <div id="loadingStatus" class="absolute flex flex-col items-center justify-center text-slate-300">
                    <div class="w-8 h-8 border-4 border-rose-500 border-t-transparent rounded-full animate-spin mb-3"></div>
                    <span id="statusText" class="text-sm font-medium">Bypassing security & extracting video...</span>
                </div>
                
                <!-- HTML5 Native Video Tag -->
                <video id="nativePlayer" controls class="w-full h-full hidden object-contain outline-none"></video>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
