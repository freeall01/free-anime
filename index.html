<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FREE-ANIME - The Ultimate Catalog</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans selection:bg-rose-500 selection:text-white">
    <header class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex items-center justify-between shadow-lg">
        <span class="text-xl font-black text-rose-500 tracking-wider">FREE<span class="text-white">-ANIME</span></span>
        <div class="w-1/2 max-w-sm">
            <input type="text" id="searchInput" placeholder="Search anime..." class="w-full bg-slate-800 text-sm text-slate-200 px-4 py-2 rounded-full border border-slate-700 focus:outline-none focus:border-rose-500 transition shadow-inner">
        </div>
    </header>

    <main class="p-4 max-w-7xl mx-auto">
        <h2 class="text-lg font-bold text-slate-200 mb-6 flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-rose-500 animate-pulse shadow-[0_0_10px_rgba(244,63,94,0.8)]"></span>
            Active Catalog
        </h2>
        <div id="animeGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 sm:gap-6">
            <div class="col-span-full text-center py-20 text-slate-400 font-medium animate-pulse">Initializing database...</div>
        </div>
    </main>

    <!-- Resilient Routing Modal -->
    <div id="videoModal" class="fixed inset-0 bg-black/95 z-50 hidden flex flex-col justify-center items-center p-4 backdrop-blur-md">
        <div class="w-full max-w-md bg-slate-900 rounded-2xl overflow-hidden border border-slate-700 shadow-2xl flex flex-col p-6 text-center">
            
            <h3 id="modalTitle" class="text-lg font-black text-white mb-2 line-clamp-1">Anime Title</h3>
            <p class="text-sm text-slate-400 mb-6">Select an active proxy server to watch. These links open safely in a new tab to bypass ISP restrictions.</p>
            
            <div id="routingButtons" class="flex flex-col gap-3 w-full mb-6">
                <!-- Buttons injected by JS -->
            </div>

            <button onclick="closeModal()" class="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-lg transition">
                Cancel
            </button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
