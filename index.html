<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FREE-ANIME - Pro Streamer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans selection:bg-rose-500 selection:text-white">
    <header class="sticky top-0 z-50 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex items-center justify-between shadow-md">
        <span class="text-xl font-black text-rose-500 tracking-wider">FREE<span class="text-white">-ANIME</span></span>
        <div class="w-1/2 max-w-sm">
            <input type="text" id="searchInput" placeholder="Search anime..." class="w-full bg-slate-800 text-sm text-slate-200 px-4 py-2 rounded-full border border-slate-700 focus:outline-none focus:border-rose-500 transition shadow-inner">
        </div>
    </header>

    <main class="p-4 max-w-7xl mx-auto">
        <h2 class="text-lg font-bold text-slate-200 mb-6 flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-rose-500 animate-pulse"></span>
            Trending Catalog
        </h2>
        <div id="animeGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 sm:gap-6">
            <div class="col-span-full text-center py-20 text-slate-400 font-medium animate-pulse">Loading catalog...</div>
        </div>
    </main>

    <!-- Reliable Iframe Modal -->
    <div id="videoModal" class="fixed inset-0 bg-black/95 z-50 hidden flex flex-col justify-center items-center p-2 sm:p-4 backdrop-blur-md">
        <div class="w-full max-w-5xl bg-slate-900 rounded-2xl overflow-hidden border border-slate-700 shadow-[0_0_30px_rgba(0,0,0,0.8)] flex flex-col">
            
            <div class="flex justify-between items-center px-4 py-3 bg-slate-950 border-b border-slate-800">
                <h3 id="modalTitle" class="text-sm font-bold text-slate-100 truncate pr-2">Player</h3>
                <button onclick="closePlayer()" class="text-rose-400 hover:text-white font-bold px-4 py-1.5 bg-slate-800 hover:bg-rose-600 rounded-lg text-xs transition shadow">✕ Close</button>
            </div>

            <div class="bg-rose-950/50 border-b border-rose-900/50 px-4 py-2 text-[11px] sm:text-xs text-rose-200 text-center flex items-center justify-center gap-2">
                <span class="font-bold text-rose-400">⚠️ ISP BLOCK WARNING:</span> If the video is black, click the green "Watch in New Tab" button below.
            </div>

            <!-- Server & Episode Controls (UPDATED FOR UNBLOCKED MIRRORS) -->
            <div class="flex items-center gap-3 px-4 py-2.5 bg-slate-900/90 border-b border-slate-800 text-xs overflow-x-auto">
                <div class="flex items-center gap-1 shrink-0">
                    <span class="text-slate-400 font-medium">Ep:</span>
                    <input type="number" id="epInput" value="1" min="1" onchange="updateStream()" class="w-12 bg-slate-950 text-rose-400 font-bold rounded px-1 py-1.5 outline-none text-center border border-slate-700 focus:border-rose-500">
                </div>
                
                <div class="w-px h-6 bg-slate-700 shrink-0"></div>
                
                <button onclick="switchServer('vidsrccc')" id="btn-vidsrccc" class="px-3 py-1.5 rounded-lg bg-rose-600 text-white font-semibold whitespace-nowrap transition shadow shrink-0">Server 1 (CC)</button>
                <button onclick="switchServer('vidsrcnet')" id="btn-vidsrcnet" class="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 whitespace-nowrap transition shrink-0">Server 2 (NET)</button>
                <button onclick="switchServer('vidsrcpm')" id="btn-vidsrcpm" class="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 whitespace-nowrap transition shrink-0">Server 3 (PM)</button>
                
                <!-- Escape Hatch -->
                <a id="externalLinkBtn" href="#" target="_blank" class="ml-auto px-4 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-bold whitespace-nowrap transition shadow animate-pulse shrink-0 flex items-center gap-1">
                    <span>⧉ Watch in New Tab</span>
                </a>
            </div>

            <div class="relative w-full aspect-video bg-black flex items-center justify-center">
                <iframe id="videoFrame" src="" class="w-full h-full border-0" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true"></iframe>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
